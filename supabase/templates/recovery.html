<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Recupera tu acceso a SIGCA</title></head>
<body style="margin:0;padding:24px 12px;background:#FFF9FB;color:#342B31;font-family:Poppins,Arial,sans-serif;font-size:16px;line-height:1.6;">
  <main style="max-width:520px;margin:0 auto;padding:24px;background:#ffffff;border:1px solid #E9D5DF;border-radius:20px;">
    <p style="margin-top:0;color:#A70459;font-family:Coiny,Poppins,Arial,sans-serif;font-size:28px;">SIGCA</p>
    <h1 style="font-size:24px;line-height:1.3;color:#5C2441;">Recupera tu acceso</h1>
    <p>Usa este enlace temporal para establecer una nueva contraseña.</p>
    <p style="margin:28px 0;"><a style="display:inline-block;padding:12px 20px;background:#DD0675;color:#ffffff;border-radius:14px;font-weight:600;text-decoration:none;" href="{{ if and .RedirectTo (ne .RedirectTo .SiteURL) }}{{ .RedirectTo }}{{ else }}{{ .SiteURL }}/auth/confirm{{ end }}?token_hash={{ .TokenHash }}&amp;type=recovery">Establecer nueva contraseña</a></p>
    <p>El enlace es temporal y solo puede utilizarse una vez.</p>
    <p style="color:#746873;">Si no solicitaste el cambio, puedes ignorar este mensaje.</p>
  </main>
</body>
</html>
